<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Luminous · 微光</title>
<link rel="icon" href="data:,">
<style>
  @font-face {
    font-family: 'PressStart2P';
    src: url('assets/fonts/PressStart2P.woff2') format('woff2');
    font-display: swap;
  }
  :root {
    --px-font: 'PressStart2P', 'Courier New', monospace;
    --cn-font: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    --c-bg: #1a1322;
    --c-panel: #2d1f3d;
    --c-border: #8b5cf6;
    --c-gold: #f5c542;
    --c-text: #efe6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: var(--c-bg);
    overflow: hidden;
    font-family: var(--cn-font);
    color: var(--c-text);
  }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    touch-action: none;
  }

  /* ===== 登录界面 ===== */
  #login {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 50% 120%, rgba(139, 92, 246, .35), transparent 60%),
      linear-gradient(#0d0a14, #1a1322 60%, #241832);
    transition: opacity .5s;
  }
  #login.hidden { opacity: 0; pointer-events: none; }
  .login-stars { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .login-stars i {
    position: absolute; width: 3px; height: 3px; background: #fff;
    animation: twinkle 2.4s infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
  .game-title {
    font-family: var(--px-font);
    font-size: clamp(28px, 6vw, 56px);
    color: var(--c-gold);
    text-shadow: 0 4px 0 #7a4a12, 0 8px 24px rgba(245, 197, 66, .35);
    letter-spacing: 4px;
    margin-bottom: 8px;
    text-align: center;
  }
  .game-subtitle {
    font-size: clamp(14px, 2.4vw, 20px);
    color: #b9a8e0;
    letter-spacing: 12px;
    margin-bottom: 48px;
    text-indent: 12px;
  }
  .login-panel {
    background: var(--c-panel);
    border: 4px solid var(--c-border);
    box-shadow: 0 0 0 4px #160f20, 0 12px 40px rgba(0,0,0,.5);
    padding: 28px 32px;
    width: min(88vw, 380px);
    display: flex; flex-direction: column; gap: 16px;
  }
  .login-panel label { font-size: 14px; color: #b9a8e0; letter-spacing: 2px; }
  .login-panel input {
    background: #160f20;
    border: 3px solid #553a7a;
    color: var(--c-text);
    padding: 12px 14px;
    font-size: 16px;
    font-family: var(--cn-font);
    outline: none;
  }
  .login-panel input:focus { border-color: var(--c-gold); }
  .btn-start {
    font-family: var(--cn-font);
    font-size: 18px; font-weight: bold;
    letter-spacing: 6px; text-indent: 6px;
    color: #2b1a00;
    background: linear-gradient(#ffd76e, #f5a942);
    border: 0;
    box-shadow: 0 5px 0 #a3620a, 0 8px 16px rgba(0,0,0,.4);
    padding: 14px 0;
    cursor: pointer;
    transition: transform .06s;
  }
  .btn-start:active { transform: translateY(4px); box-shadow: 0 1px 0 #a3620a; }
  .login-tip { font-size: 12px; color: #6f5b94; text-align: center; letter-spacing: 1px; }
  .version-tag {
    position: absolute; bottom: 12px; right: 16px;
    font-size: 12px; color: #55456e;
  }

  /* 竖屏提示 */
  #rotate-tip {
    display: none;
    position: absolute; inset: 0; z-index: 99;
    background: rgba(13, 10, 20, .95);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    font-size: 18px; letter-spacing: 4px;
  }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate-tip { display: flex; }
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="270"></canvas>
  </div>

  <!-- 登录界面 -->
  <div id="login">
    <div class="login-stars" id="stars"></div>
    <div class="game-title">LUMINOUS</div>
    <div class="game-subtitle">微 光 · 荒 原 物 语</div>
    <div class="login-panel">
      <label for="nickname">旅人代号</label>
      <input id="nickname" maxlength="12" placeholder="输入你的名字…" autocomplete="off">
      <button class="btn-start" id="btnStart">进 入 荒 原</button>
      <div class="login-tip">v0.1 · 单机体验 · 进度保存在本机</div>
    </div>
    <div class="version-tag">LuminousSSS</div>
  </div>

  <!-- 竖屏提示 -->
  <div id="rotate-tip">
    <div style="font-size:40px">📱↻</div>
    <div>请横屏游玩</div>
  </div>

  <script src="src/game.js"></script>
</body>
</html>
